[project]
name = "housing-price-mlops"
version = "0.1.0"
description = "Continuous training MLOps platform for housing price prediction"
requires-python = ">=3.12,<3.13"
dependencies = ["housing-ml"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff==0.17.6"]

[tool.uv]
package = false

[tool.uv.sources]
housing-ml = { workspace = true }

[tool.uv.workspace]
members = ["housing_ml"]

[tool.pytest.ini_options]
testpaths = ["housing_ml/tests"]
