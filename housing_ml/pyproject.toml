[project]
name = "housing-ml"
version = "0.1.0"
description = "Shared data rules, features, drift, training decision and promotion gates"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.4.2",
    "pandas==2.3.3",
    "scipy==1.17.1",
    "scikit-learn==1.8.0",
    "threadpoolctl>=3.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/housing_ml"]
