name: Build Streamlit

on:
  push:
    branches: [master]
    paths:
      - streamlit/Dockerfile
      - streamlit/requirements.txt
      - streamlit/housing_ui/**
      - .github/workflows/build-streamlit.yml
      - .github/workflows/_build-push.yml
  pull_request:
    paths:
      - streamlit/Dockerfile
      - streamlit/requirements.txt
      - streamlit/housing_ui/**
      - .github/workflows/build-streamlit.yml
      - .github/workflows/_build-push.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  streamlit:
    uses: ./.github/workflows/_build-push.yml
    with:
      component: streamlit
      image: crissebasbol/housing-streamlit
      context: streamlit
      dockerfile: streamlit/Dockerfile
      manifest: streamlit/k8s/deployment.yaml
      yq_path: .spec.template.spec.containers[0].image
    secrets: inherit
