apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamlit
  labels:
    app: streamlit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: streamlit
  template:
    metadata:
      labels:
        app: streamlit
    spec:
      nodeSelector:
        mlops/tier: serving
      containers:
        - name: streamlit
          image: crissebasbol/housing-streamlit:sha-0ccd1d3
          ports:
            - name: http
              containerPort: 8501
          envFrom:
            - configMapRef:
                name: streamlit
          env:
            - name: DATA_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-data, key: APP_READER_PASSWORD}
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
